<text x="675.0" y="94" font-family="'Apple SD Gothic Neo','Pretendard','Noto Sans KR',sans-serif" font-size="14" font-weight="700" fill="#1f2328" text-anchor="middle">4 잔량 취소</text>
<text x="675.0" y="112" font-family="'Apple SD Gothic Neo','Pretendard','Noto Sans KR',sans-serif" font-size="12" font-weight="400" fill="#6e7781" text-anchor="middle">남은 6주</text>
