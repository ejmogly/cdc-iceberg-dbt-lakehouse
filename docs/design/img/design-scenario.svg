<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 526" width="1280" height="526" role="img" aria-label="증권 앱 시나리오에서 테이블마다 생기는 변경 이벤트"><title>증권 앱 시나리오에서 테이블마다 생기는 변경 이벤트</title><rect width="100%" height="100%" fill="#ffffff"/><text x="30" y="36" font-family="'Apple SD Gothic Neo','Pretendard','Noto Sans KR',sans-serif" font-size="18" font-weight="700" fill="#1f2328" text-anchor="start">시나리오: 계좌 A-0001이 삼성전자(005930)를 사고, 정정하고, 취소하고, 전부 판다</text>
