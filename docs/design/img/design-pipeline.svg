<text x="44" y="105" font-family="'Apple SD Gothic Neo','Pretendard','Noto Sans KR',sans-serif" font-size="13" font-weight="600" fill="#7a5d00" text-anchor="start">시세 적재기: 공공 데이터를 하루 한 번 받아 넣음</text>
