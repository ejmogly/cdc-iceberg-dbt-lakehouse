<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1392 540" width="1392" height="540" role="img" aria-label="증권 앱 파이프라인: 원천 DB에서 Gold 지표까지"><title>증권 앱 파이프라인: 원천 DB에서 Gold 지표까지</title><rect width="100%" height="100%" fill="#ffffff"/><text x="30" y="36" font-family="'Apple SD Gothic Neo','Pretendard','Noto Sans KR',sans-serif" font-size="18" font-weight="700" fill="#1f2328" text-anchor="start">파이프라인: 원천 DB에서 Gold 지표까지</text>
<text x="30" y="60" font-family="'Apple SD Gothic Neo','Pretendard','Noto Sans KR',sans-serif" font-size="13" font-weight="400" fill="#424a53" text-anchor="start">위 상자는 단계마다 맡는 일, 아래 점선 상자는 아직 고민되는 점입니다. 초록 칩은 이 저장소에 이미 구현한 것, 회색 칩은 그 회차에 만들 것입니다.</text>
