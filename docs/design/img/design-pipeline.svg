<text x="30" y="474" font-family="'Apple SD Gothic Neo','Pretendard','Noto Sans KR',sans-serif" font-size="13" font-weight="600" fill="#1f2328" text-anchor="start">원천 변경 → Gold 지표: 장중 현황 5분 안, 일별 확정 지표는 시장 마감 뒤 시세가 들어온 때부터 30분 안 (잠정)</text>
<text x="30" y="516" font-family="'Apple SD Gothic Neo','Pretendard','Noto Sans KR',sans-serif" font-size="13" font-weight="400" fill="#424a53" text-anchor="start">Spark SQL이 Silver를, dbt가 Gold를 만듭니다. 원천부터 Kafka까지는 3회차에 이 저장소에서 만들어 시나리오로 확인했고, Flink부터는 4회차에 붙입니다.</text></svg>
