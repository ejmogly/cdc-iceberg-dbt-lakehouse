# 로컬 실행 구성
#
# 기본 profile(아무 옵션 없이 up)은 2회차까지 쓰는 서비스만 띄웁니다.
#   docker compose up -d
# 뒤 회차의 서비스는 profile로 나눠 회차마다 이 파일에 더합니다.
#   lake    : minio, Iceberg REST 카탈로그 (3회차)
#   flink   : jobmanager, taskmanager      (3회차)
#   spark   : Spark, Thrift server         (4~5회차)
#   airflow : airflow standalone           (8회차)
#
# 비밀값은 .env에서만 읽습니다. .env.example을 복사해 값을 바꾸세요.
# 포트는 모두 127.0.0.1에만 엽니다.

name: ${COMPOSE_PROJECT_NAME:-cdclake}

services:
  postgres:
    image: postgres:16.15
    command:
      - postgres
      - -c
      - wal_level=logical
      - -c
      - max_replication_slots=4
      - -c
      - max_wal_senders=4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-source_db}
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD를 .env에 넣으세요}
      CDC_USER: ${CDC_USER:-cdc_reader}
      CDC_PASSWORD: ${CDC_PASSWORD:?CDC_PASSWORD를 .env에 넣으세요}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  kafka:
    image: apache/kafka:4.3.2
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:-2ZWbiQ_USWWTMx2df1Z8rw}
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,PLAINTEXT_HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:${KAFKA_HOST_PORT:-29092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
    ports:
      - "127.0.0.1:${KAFKA_HOST_PORT:-29092}:29092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20

  # Kafka Connect + Debezium PostgreSQL 커넥터 (infra/connect/Dockerfile로 빌드).
  # 워커 설정은 infra/connect/connect-distributed.properties에 있습니다.
  # 커넥터 설정의 ${env:...}는 EnvVarConfigProvider가 아래 환경 변수로 바꿉니다.
  connect:
    build: ./infra/connect
    image: cdclake/connect:4.3.2-debezium-3.6.3
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      KAFKA_HEAP_OPTS: -Xms256m -Xmx1g
      POSTGRES_DB: ${POSTGRES_DB:-source_db}
      CDC_USER: ${CDC_USER:-cdc_reader}
      CDC_PASSWORD: ${CDC_PASSWORD:?CDC_PASSWORD를 .env에 넣으세요}
    ports:
      - "127.0.0.1:${CONNECT_PORT:-18083}:8083"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO /dev/null http://localhost:8083/connector-plugins"]
      interval: 10s
      timeout: 5s
      retries: 30

  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_NAME: connect
      KAFKA_CLUSTERS_0_KAFKACONNECT_0_ADDRESS: http://connect:8083
    ports:
      - "127.0.0.1:${KAFKA_UI_PORT:-18080}:8080"

volumes:
  pg-data:
  kafka-data:
