# 증권 앱 Gold(dbt-spark, Iceberg). 설계는 학습 가이드 05 12절입니다.
#   docker compose --profile spark run --rm dbt build
# Silver 현재 상태 다섯 테이블(lake.silver.*: 주문, 체결, 잔고, 시세, 환율)은 dbt가 아니라 sql/silver의 MERGE가 만듭니다.
# dbt는 그것을 source로 읽어 Silver core(dim, fct)와 Gold(mart)를 만듭니다.
name: brokerage_lakehouse
version: "1.0.0"
config-version: 2
profile: brokerage_lakehouse

model-paths: [models]
seed-paths: [seeds]
test-paths: [tests]
macro-paths: [macros]
clean-targets: [target]

flags:
  send_anonymous_usage_stats: false

models:
  brokerage_lakehouse:
    +file_format: iceberg
    # 처음에는 매번 통째로 다시 만듭니다. 지난 날짜의 정정도 그대로 반영됩니다(가이드 05 10절).
    +materialized: table
    core:
      +schema: silver
    gold:
      +schema: gold
    # 손익 모델(sql/pnl/과 같은 규칙, 장부만 Spark 판). 화면 손익과 대조합니다(loaders/screen_trades.py --verify).
    pnl:
      +schema: gold

seeds:
  brokerage_lakehouse:
    +file_format: iceberg
    +schema: silver
    # instruments.csv에 group처럼 SQL 예약어인 칸 이름이 있어 칸 이름을 따옴표로 감쌉니다.
    +quote_columns: true
    instruments:
      # 005930처럼 0으로 시작하는 종목 코드가 숫자로 읽혀 0이 빠지지 않게 합니다.
      +column_types:
        symbol: string
