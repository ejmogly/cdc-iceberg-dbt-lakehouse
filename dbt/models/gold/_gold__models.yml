version: 2

models:
  - name: mart_daily_symbol_trading
    description: >
      종목과 거래일(그 시장의 현지 날짜)별 체결 대금, 수량, 건수. 종목 통화 그대로이며
      원화 환산, 수수료와 세금 반영 전. 회계 손익이 아님. 철회된 체결은 빠지고,
      취소된 주문의 이미 체결된 부분은 들어갑니다.
    columns:
      - name: symbol
        data_tests: [not_null]
      - name: trade_date
        data_tests: [not_null]
      - name: currency
        data_tests: [not_null]
      - name: execution_count
        data_tests: [not_null]
      - name: traded_qty
        data_tests: [not_null]
      - name: traded_value
        data_tests: [not_null]

  - name: mart_holding_reconciliation
    description: >
      계좌와 종목별 잔고 대사. executed_net_qty(체결 매수 합 - 매도 합)와
      holding_qty(Silver 유효 잔고 수량)의 차이 qty_diff는 0이어야 합니다
      (tests/holding_reconciliation.sql).
    columns:
      - name: account_id
        data_tests: [not_null]
      - name: symbol
        data_tests: [not_null]
      - name: qty_diff
        data_tests: [not_null]
