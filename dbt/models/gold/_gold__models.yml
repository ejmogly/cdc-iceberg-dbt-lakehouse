version: 2

models:
  - name: mart_daily_symbol_trading
    description: >
      종목과 거래일(그 시장의 현지 날짜)별 체결 대금, 수량, 건수. 종목 통화 그대로이며
      원화 환산, 수수료와 세금 반영 전. 회계 손익이 아님. 철회된 체결은 빠지고,
      취소된 주문의 이미 체결된 부분은 들어갑니다.
    columns:
      - name: symbol
        data_tests: [not_null]
      - name: trade_date
        data_tests: [not_null]
      - name: currency
        data_tests: [not_null]
      - name: execution_count
        data_tests: [not_null]
      - name: traded_qty
        data_tests: [not_null]
      - name: traded_value
        data_tests: [not_null]

  - name: mart_holding_reconciliation
    description: >
      계좌와 종목별 잔고 대사. executed_net_qty(체결 매수 합 - 매도 합)와
      holding_qty(Silver 유효 잔고 수량)의 차이 qty_diff는 0이어야 합니다
      (tests/holding_reconciliation.sql).
    columns:
      - name: account_id
        data_tests: [not_null]
      - name: symbol
        data_tests: [not_null]
      - name: qty_diff
        data_tests: [not_null]

  - name: mart_symbol_daily
    description: >
      종목과 거래일(그 시장의 현지 날짜)별 시세(시가, 고가, 저가, 종가, 거래량, 수정 전 가격)와
      종목 정보, 미국 종목이면 그날 원/달러 매매기준율(없으면 NULL). 내 투자 돌아보기 화면이
      이 마트를 읽고, 내보낼 때 원천과 받은 원본에 한 행씩 대조합니다(ai/screen_data.py).
    columns:
      - name: symbol
        data_tests: [not_null]
      - name: market
        data_tests: [not_null]
      - name: currency
        data_tests: [not_null]
      - name: trade_date
        data_tests: [not_null]
      - name: close_price
        data_tests: [not_null]
      - name: volume
        data_tests: [not_null]

  - name: mart_fx_daily
    description: >
      고시일별 원/달러 매매기준율(한국은행 ECOS). 한국 휴일에는 행이 없습니다.
      화면이 이 마트를 읽고, 내보낼 때 원천과 받은 원본에 하루씩 대조합니다.
    columns:
      - name: rate_date
        data_tests: [not_null, unique]
      - name: usdkrw_rate
        data_tests: [not_null]

