# dbt 컨테이너(docker-compose.yml의 dbt)에서 spark 컨테이너의 Thrift server로 붙습니다.
# 로컬 실습용이라 인증이 없고(NOSASL), 포트는 compose 네트워크 안에서만 씁니다. 비밀값이 없습니다.
brokerage_lakehouse:
  target: local
  outputs:
    local:
      type: spark
      method: thrift
      host: spark
      port: 10000
      user: dbt
      auth: NOSASL
      schema: gold
      threads: 1
      connect_retries: 5
      connect_timeout: 15
